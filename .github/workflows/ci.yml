name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCL_VERSION: "4.77.1"

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: yamllint -s .gitlab-ci.yml ci deploy .github .yamllint.yaml

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=app --cov-report=term

  # Runs the lint and test jobs of .gitlab-ci.yml themselves, in docker, with
  # gitlab-ci-local. build:image and the deploy jobs need a real GitLab runner
  # (dind, registry), so they are only parsed here, not run.
  gitlab-ci-local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g "gitlab-ci-local@${GCL_VERSION}"
      - name: parse the whole pipeline
        run: |
          gitlab-ci-local --preview > /dev/null
          gitlab-ci-local --list
      - name: lint jobs
        run: gitlab-ci-local lint:python lint:yaml lint:dockerfile lint:shell
      - name: test matrix
        run: |
          gitlab-ci-local 'test: [3.9]' 'test: [3.12]'
