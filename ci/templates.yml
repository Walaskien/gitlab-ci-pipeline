# Hidden jobs and rule sets shared by the real jobs. Anchors do not cross
# include boundaries, so reuse between files goes through extends and !reference.

.python:
  image: python:${PYTHON_VERSION}-slim
  cache:
    key:
      files:
        - requirements-dev.txt
        - app/requirements.txt
      prefix: pip-py${PYTHON_VERSION}
    paths:
      - .cache/pip
  before_script:
    - pip install -r requirements-dev.txt

# Docker-in-Docker: a privileged sidecar that runs the daemon, the job
# container only has the docker client and talks to it over TLS.
.dind:
  image: docker:${DOCKER_VERSION}
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  timeout: 15m
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  after_script:
    - docker logout "$CI_REGISTRY" || true

.rules:default-branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
